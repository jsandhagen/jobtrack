<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' about:">
  <title>Sprout — Job Application Buddy</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="shell">
    <nav class="side">
      <div class="brand"><span class="brand-mark" id="brandMark"></span><div><b>Sprout</b><small>job application buddy</small></div></div>
      <a href="#home" data-view="home" data-icon="home"><span>Home</span></a>
      <a href="#check" data-view="check" data-icon="search"><span>Check a job</span></a>
      <a href="#applications" data-view="applications" data-icon="clipboard"><span>Applications</span></a>
      <a href="#library" data-view="library" data-icon="books"><span>My library</span></a>
      <a href="#bank" data-view="bank" data-icon="stack"><span>Bullet bank</span></a>
      <a href="#profile" data-view="profile" data-icon="user"><span>Profile</span></a>
      <a href="#settings" data-view="settings" data-icon="sliders"><span>Settings</span></a>
      <div class="buddy" id="buddy"></div>
      <div class="side-foot" id="sideFoot"></div>
    </nav>
    <main id="view"></main>
  </div>
  <div class="toasts" id="toasts"></div>
  <div class="modal" id="modal" hidden><div class="modal-card card" id="modalCard"></div></div>
  <script src="icons.js"></script>
  <script src="buddyLines.js"></script>
  <script src="mascot.js"></script>
  <script src="../shared/resumeDoc.js"></script>
  <script src="dashboard.js"></script>
  <script src="bank.js"></script>
  <script src="editor.js"></script>
</body>
</html>
