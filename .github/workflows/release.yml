# Builds the installers on Windows, macOS and Linux on every push to main,
# smoke-tests each packaged app, and publishes them as the latest GitHub
# Release. The README's download links point at
# releases/latest/download/<file>, so they always get the newest build.
#
# Each build is versioned <major>.<minor>.<run number> (major and minor come
# from package.json), and tagged v<that version>.
#
# Code signing is optional. Without certificates, Windows shows a SmartScreen
# warning and macOS asks to confirm the app on first launch (see README). To
# sign, add these repository secrets:
#   macOS:   MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
name: Build installers

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'test/**']
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Set version
        run: |
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
          node scripts/sync-extension.js --stamp-version

      - name: Build installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "macOS" && -z "$CSC_LINK" ]]; then
            # No Apple certificate: sign ad hoc so the app still opens on Apple Silicon.
            extra+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          [[ -z "$CSC_LINK" ]] && unset CSC_LINK CSC_KEY_PASSWORD
          [[ -z "$WIN_CSC_LINK" ]] && unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          [[ -z "$APPLE_ID" ]] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder --publish never "${extra[@]}"

      - name: Smoke-test the packaged app
        run: npm run smoke-test:packaged

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          # latest*.yml and the blockmaps let the in-app updater find and
          # download new versions (see src/main/updater.js).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sprout ${{ needs.version.outputs.version }}
          make_latest: true
          files: installers/*
          body: |
            Download the installer for your computer:

            - **Windows:** `Sprout-win-x64.exe`
            - **Mac with Apple Silicon (M1 and newer):** `Sprout-mac-arm64.dmg`
            - **Mac with Intel:** `Sprout-mac-x64.dmg`
            - **Linux:** `Sprout-linux-x86_64.AppImage`

            First launch: on Windows, if you see "Windows protected your PC", click **More info → Run anyway**. On a Mac, if it says it can't verify the developer, open **System Settings → Privacy & Security** and click **Open Anyway**.

            Built from ${{ github.sha }}.
